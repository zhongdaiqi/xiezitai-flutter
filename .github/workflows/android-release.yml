name: Android Release

# ---------------------------------------------------------------------------
# 目的：在没有 Mac 电脑的前提下，把写字台 Android 客户端签名后产出发布包，
#       并可选择性自动上传到 Google Play 内部测试轨道。
#
# 签名材料全部来自仓库 Secrets（本机与仓库里都不存放任何密钥文件）：
#   KEYSTORE_BASE64        上传密钥库 upload-keystore.jks 的完整 base64
#   KEYSTORE_PASSWORD      keystore 的 store 密码
#   KEY_ALIAS              签名密钥的 alias
#   KEY_PASSWORD           签名密钥的 key 密码
#   PLAY_STORE_SERVICE_ACCOUNT_JSON  （可选）Google Play 服务账号 JSON 全文
#
# 触发方式：
#   - 手动（Actions → Android Release → Run workflow）
#   - 打 tag（v1.0.0 这种）时自动跑
# 刻意不挂 push 到 main：发布构建要还原密钥、跑完整签名，日常提交走 android.yml 就够了。
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  release-android:
    name: 签名构建并产出发布包
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 环境信息（排错用）
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      # ---------------------------------------------------------------------
      # 从 Secrets 还原签名材料。先做一次健全性自检：缺核心 Secret 直接报错，
      # 免得后面出现看不懂的「签名失败」。密钥只存在于 runner 临时文件，
      # 用完在最后一步 if: always() 里删掉。
      # ---------------------------------------------------------------------
      - name: 还原签名密钥（Keystore + key.properties）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少签名 Secret。Android 发布流水线需要 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD。生成与编码方式见 docs/android-signing-setup.md"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks || { echo "::error::Keystore 解码为空，请确认 KEYSTORE_BASE64 是 upload-keystore.jks 的完整 base64"; exit 1; }
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          echo "签名材料就位：android/app/upload-keystore.jks + android/key.properties"

      - name: 构建签名 release AAB（Google Play 用）
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: 构建签名 release APK（split-per-abi，分发/侧载用）
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: 核对产物信息
        run: |
          set -euo pipefail
          echo "=== 产物清单 ==="
          find build/app/outputs \( -name '*.aab' -o -name '*.apk' \) | sort
          echo
          echo "=== 体积 ==="
          find build/app/outputs \( -name '*.aab' -o -name '*.apk' \) -exec sh -c 'printf "%-8s %s\n" "$(du -h "$1" | cut -f1)" "$1"' _ {} \;

      - name: 上传签名产物
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-release
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 检查 PLAY_STORE_SERVICE_ACCOUNT_JSON Secret
        id: check_play_secret
        shell: bash
        run: |
          if [ -z "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "has_play_store_secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_play_store_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传到 Google Play（内部测试轨道）
        if: ${{ steps.check_play_secret.outputs.has_play_store_secret == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: cn.xiezitai.app
          releaseFiles: build/app/outputs/bundle/release/*.aab
          track: internal
          status: completed

      - name: 清理密钥
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
